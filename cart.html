<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shopping Karo | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .cart-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      padding: 0;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="index.html">🛍 Shopping Karo</a>
  <a href="index.html" class="btn btn-outline-light btn-sm">Continue Shopping</a>
</nav>

<!-- CART CONTENT -->
<div class="container my-5">
  <div class="row">

    <!-- Cart Items -->
    <div class="col-lg-8">
      <h4 class="mb-4">Your Cart</h4>
      <div id="cart-list"></div>
    </div>

    <!-- Summary -->
    <div class="col-lg-4">
      <div class="bg-white shadow-sm rounded p-4">
        <h5 class="mb-3">Order Summary</h5>

        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
          <span>Shipping</span>
          <span class="text-success">Free</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between fw-bold mb-3">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>

        <button class="btn btn-dark w-100" onclick="checkout()">
          Checkout
        </button>
      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="bg-light text-center py-3 mt-5">
  <small class="text-secondary">© 2026 Shopping Karo. All rights reserved.</small>
</footer>

<!-- CART LOGIC -->
<script>
function loadCart() {
  const cart = JSON.parse(localStorage.getItem("myCart")) || [];
  const list = document.getElementById("cart-list");

  let total = 0;
  list.innerHTML = "";

  if (cart.length === 0) {
    list.innerHTML = `
      <div class="text-center bg-white p-5 rounded shadow-sm">
        <h5>Your cart is empty</h5>
        <a href="index.html" class="btn btn-dark mt-3">Continue Shopping</a>
      </div>`;
    updateTotal(0);
    return;
  }

  cart.forEach((item, index) => {
    const itemTotal = item.price * item.qty;
    total += itemTotal;

    list.innerHTML += `
      <div class="row align-items-center bg-white shadow-sm rounded p-3 mb-3">
        <div class="col-2 text-center">
          <img src="${item.image}" class="cart-img">
        </div>

        <div class="col-4">
          <h6 class="mb-1">${item.title}</h6>
          <small class="text-muted">$${item.price}</small>
        </div>

        <div class="col-3 d-flex align-items-center">
          <button class="btn btn-outline-secondary qty-btn"
            onclick="changeQty(${index}, -1)">−</button>
          <span class="mx-3 fw-bold">${item.qty}</span>
          <button class="btn btn-outline-secondary qty-btn"
            onclick="changeQty(${index}, 1)">+</button>
        </div>

        <div class="col-2 fw-bold text-primary">
          $${itemTotal.toFixed(2)}
        </div>

        <div class="col-1 text-end">
          <button class="btn btn-sm btn-outline-danger"
            onclick="removeItem(${index})">✕</button>
        </div>
      </div>
    `;
  });

  updateTotal(total);
}

function changeQty(index, change) {
  const cart = JSON.parse(localStorage.getItem("myCart"));
  cart[index].qty = Math.max(1, cart[index].qty + change);
  localStorage.setItem("myCart", JSON.stringify(cart));
  loadCart();
}

function removeItem(index) {
  const cart = JSON.parse(localStorage.getItem("myCart"));
  cart.splice(index, 1);
  localStorage.setItem("myCart", JSON.stringify(cart));
  loadCart();
}

function updateTotal(total) {
  document.getElementById("subtotal").innerText = "$" + total.toFixed(2);
  document.getElementById("total").innerText = "$" + total.toFixed(2);
}

function checkout() {
  alert("Order placed successfully 🎉");
  localStorage.removeItem("myCart");
  loadCart();
}

document.addEventListener("DOMContentLoaded", loadCart);
</script>

</body>
</html>
